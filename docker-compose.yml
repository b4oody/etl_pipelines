version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: etl_postgres
    environment:
      POSTGRES_USER: ${JSONPLACEHOLDER_DB_USER}
      POSTGRES_PASSWORD: ${JSONPLACEHOLDER_DB_PASSWORD}
      POSTGRES_DB: ${JSONPLACEHOLDER_DB_NAME}
    ports:
      - "${JSONPLACEHOLDER_DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JSONPLACEHOLDER_DB_USER} -d ${JSONPLACEHOLDER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_currency:
    image: postgres:15-alpine
    container_name: etl_postgres_currency
    environment:
      POSTGRES_USER: ${POSTGRES_CURRENCY_DB_USER}
      POSTGRES_PASSWORD: ${POSTGRES_CURRENCY_DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_CURRENCY_DB_NAME}
    ports:
      - "${POSTGRES_CURRENCY_DB_PORT}:5432"
    volumes:
      - postgres_currency_data:/var/lib/postgresql/data
      - ./currency_schema.sql:/docker-entrypoint-initdb.d/currency_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_CURRENCY_DB_USER} -d ${POSTGRES_CURRENCY_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  postgres_currency_data:
    driver: local
